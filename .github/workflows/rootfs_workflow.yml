name: Daily Multi-Architecture RootFS Generator

on:
  schedule:
    - cron: '0 5,11,17,23 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force re-build (Bypass Cache)'
        required: false
        type: boolean
        default: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, armv7, 386]
        distro:
          - name: ubuntu
            image: ubuntu:latest
          - name: debian
            image: debian:latest
          - name: devuan
            image: devuan/devuan:latest
          - name: alpine
            image: alpine:latest
          - name: kali-linux
            image: kalilinux/kali-rolling:latest
          - name: fedora
            image: fedora:latest
          - name: archlinux
            image: archlinux:latest
          - name: centos-stream
            image: quay.io/centos/centos:stream9
          - name: rockylinux
            image: rockylinux:9
          - name: almalinux
            image: almalinux:9
          - name: opensuse-leap
            image: opensuse/leap:latest
          - name: opensuse-tumbleweed
            image: opensuse/tumbleweed:latest
          - name: openwrt
            image: openwrt/rootfs:latest
          - name: openeuler
            image: openeuler/openeuler:latest
          - name: openkylin
            image: openkylin/openkylin:latest
          - name: busybox
            image: busybox:latest
          - name: voidlinux
            image: ghcr.io/void-linux/void-linux:latest-full-x86_64
          - name: clearlinux
            image: clearlinux:latest
          - name: amazonlinux
            image: amazonlinux:latest
          - name: oraclelinux
            image: oraclelinux:9
          - name: gentoo
            image: gentoo/stage3:latest
          - name: nixos
            image: nixos/nix:latest

        exclude:
          - arch: arm64
            distro: { name: archlinux }
          - arch: armv7
            distro: { name: archlinux }
          - arch: 386
            distro: { name: archlinux }
          - arch: 386
            distro: { name: ubuntu }
          - arch: arm64
            distro: { name: devuan }
          - arch: armv7
            distro: { name: devuan }
          - arch: 386
            distro: { name: devuan }
          - arch: 386
            distro: { name: fedora }
          - arch: armv7
            distro: { name: fedora }
          - arch: 386
            distro: { name: opensuse-leap }
          - arch: armv7
            distro: { name: opensuse-leap }
          - arch: 386
            distro: { name: opensuse-tumbleweed }
          - arch: armv7
            distro: { name: opensuse-tumbleweed }
          - arch: 386
            distro: { name: openwrt }
          - arch: armv7
            distro: { name: openwrt }
          - arch: 386
            distro: { name: openeuler }
          - arch: armv7
            distro: { name: openeuler }
          - arch: 386
            distro: { name: openkylin }
          - arch: armv7
            distro: { name: openkylin }
          - arch: 386
            distro: { name: centos-stream }
          - arch: armv7
            distro: { name: centos-stream }
          - arch: 386
            distro: { name: rockylinux }
          - arch: armv7
            distro: { name: rockylinux }
          - arch: 386
            distro: { name: almalinux }
          - arch: armv7
            distro: { name: almalinux }
          - arch: arm64
            distro: { name: voidlinux }
          - arch: armv7
            distro: { name: voidlinux }
          - arch: 386
            distro: { name: voidlinux }
          - arch: arm64
            distro: { name: clearlinux }
          - arch: armv7
            distro: { name: clearlinux }
          - arch: 386
            distro: { name: clearlinux }
          - arch: 386
            distro: { name: amazonlinux }
          - arch: armv7
            distro: { name: amazonlinux }
          - arch: 386
            distro: { name: oraclelinux }
          - arch: armv7
            distro: { name: oraclelinux }
          - arch: armv7
            distro: { name: gentoo }
          - arch: 386
            distro: { name: gentoo }
          - arch: armv7
            distro: { name: nixos }
          - arch: 386
            distro: { name: nixos }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Fetch Manifest & Check Digest
        id: check_digest
        run: |
          DISTRO_NAME="${{ matrix.distro.name }}"
          IMAGE="${{ matrix.distro.image }}"
          ARCH="${{ matrix.arch }}"
          
          PLATFORM="linux/$ARCH"
          if [ "$ARCH" = "armv7" ]; then
            PLATFORM="linux/arm/v7"
          fi

          if ! docker pull --platform "$PLATFORM" "$IMAGE"; then
            echo "::warning ::Failed to pull $IMAGE for $PLATFORM. Skipping."
            echo "SKIP_JOB=true" >> $GITHUB_ENV
            exit 0
          fi

          DIGEST=$(docker inspect --format='{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}{{end}}' "$IMAGE" | cut -d'@' -f2)

          if [ -z "$DIGEST" ]; then
            echo "::warning ::Could not extract digest for $IMAGE. Skipping."
            echo "SKIP_JOB=true" >> $GITHUB_ENV
            exit 0
          fi

          echo "CURRENT_DIGEST=$DIGEST" >> $GITHUB_ENV
          
          DIGEST_FILE="digest_${DISTRO_NAME}_${ARCH}.txt"
          echo "$DIGEST" > "$DIGEST_FILE"
          echo "DIGEST_FILE=$DIGEST_FILE" >> $GITHUB_ENV

      - name: Cache Image State
        if: env.SKIP_JOB != 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.force_build != 'true')
        id: cache_check
        uses: actions/cache@v4
        with:
          path: ${{ env.DIGEST_FILE }}
          key: digest-${{ matrix.distro.name }}-${{ matrix.arch }}-${{ env.CURRENT_DIGEST }}

      - name: Build RootFS on New Version
        if: env.SKIP_JOB != 'true' && (steps.cache_check.outputs.cache-hit != 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_build == 'true'))
        run: |
          DISTRO_NAME="${{ matrix.distro.name }}"
          IMAGE="${{ matrix.distro.image }}"
          ARCH="${{ matrix.arch }}"
          
          DATE_ONLY=$(date +'%m-%d-%Y')
          TAG_NAME="${DATE_ONLY}-${ARCH}"
          
          PLATFORM="linux/$ARCH"
          if [ "$ARCH" = "armv7" ]; then
            PLATFORM="linux/arm/v7"
          fi

          CONTAINER_ID=$(docker create --platform "$PLATFORM" "$IMAGE" true)
          FILE_NAME="${DISTRO_NAME}-rootfs-${ARCH}.tar.gz"
          docker export $CONTAINER_ID | gzip -9 > "$FILE_NAME"
          docker rm $CONTAINER_ID

          echo "FILE_NAME=$FILE_NAME" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV
          echo "BUILD_DATE=$DATE_ONLY" >> $GITHUB_ENV
          echo "HAS_NEW_BUILD=true" >> $GITHUB_ENV

      - name: Upload to GitHub Release
        if: env.SKIP_JOB != 'true' && env.HAS_NEW_BUILD == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "RootFS Build - ${{ env.RELEASE_TAG }}"
          append_body: true
          body: |
            ### Update: **${{ matrix.distro.name }}** (`${{ matrix.arch }}`)
            * Image Source: `${{ matrix.distro.image }}`
            * Build Date: ${{ env.BUILD_DATE }}
            * SHA256 Digest: `${{ env.CURRENT_DIGEST }}`
            ---
          files: ${{ env.FILE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
